[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-vertex-bridge"
version = "0.4.0"
description = "A lightweight Vertex AI reverse proxy with dual auth mode (Service Account + API Key)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "zetaloop", email = "zetaloop@outlook.com" }]
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = [
    "google-auth",
    "fastapi",
    "uvicorn",
    "httpx[http2,socks]",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
]
urls = { repository = "https://github.com/zetaloop/simple-vertex-bridge" }

[project.scripts]
simple-vertex-bridge = "svbridge.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
